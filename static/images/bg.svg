<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="softGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8f6f2" />
      <stop offset="60%" stop-color="#f7f8fc" />
      <stop offset="100%" stop-color="#f6f1fb" />
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#softGrad)" />

  <!-- Soft, blurred organic shapes -->
  <g opacity="0.22" filter="url(#blur)">
    <path fill="#cfeee8" d="M-50,200 C150,100 350,120 600,190 C850,260 1050,220 1250,180 L1250,900 L-50,900 Z" />
    <path fill="#f0e9fb" d="M-100,500 C120,420 380,460 620,520 C860,580 1080,540 1300,500 L1300,1100 L-100,1100 Z" />
  </g>

  <!-- Subtle floating blobs -->
  <g opacity="0.09" fill="#85c6bf">
    <ellipse cx="140" cy="140" rx="220" ry="120" />
    <ellipse cx="500" cy="320" rx="360" ry="180" />
    <ellipse cx="980" cy="600" rx="260" ry="140" />
  </g>

  <!-- Gentle wave line for structure -->
  <path d="M0,720 C240,640 480,760 720,700 C960,640 1200,760 1440,700 L1440,820 L0,820 Z" fill="#ffffff" opacity="0.03"/>

  <!-- tiny grain overlay for texture -->
  <rect width="100%" height="100%" fill="transparent" />
</svg>